<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Viewer - Dracula Theme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Stored Database Entries (Dracula UI Route)</h2>

    <div class="btn-group">
        <button type="button" id="backBtn" onclick="window.location.href='index.html'">← Back to Form</button>
        <button type="button" id="csvBtn">Export CSV</button>
    </div>

    <!-- Layout controls for searching and changing items per page -->
    <div class="controls-row">
        <div class="form-group flex-grow">
            <label for="searchInput">Live Search Filter</label>
            <input type="text" id="searchInput" placeholder="Search by name, email substring, or phone number...">
        </div>
        
        <div class="form-group pagination-selector-group">
            <label for="perPageSelect">Items Per Page</label>
            <select id="perPageSelect">
                <option value="5" selected>5</option>
                <option value="10">10</option>
                <option value="25">25</option>
            </select>
        </div>
    </div>

    <!-- Data Render Target -->
    <div id="tableContainer"></div>

    <!-- Pagination Controller View -->
    <div class="pagination-container" id="paginationControls"></div>

    <!-- Data Visualization Dashboard Wrapper -->
    <div class="chart-box">
        <h3>Email Domain Breakdown</h3>
        <div id="chartContainer"></div>
    </div>

    <!-- SQL Command Sandbox Display -->
    <div class="sql-box">
        <h3>Generated Pseudo-SQL Command</h3>
        <code id="sqlDisplay">SELECT * FROM form_entries;</code>
    </div>

    <script src="entries.js"></script>
</body>
</html>

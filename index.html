<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Application - DOM Manipulation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            max-width: 600px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="email"], textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            margin-right: 10px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        #viewBtn {
            background-color: #28a745;
        }
        #viewBtn:hover {
            background-color: #218838;
        }
        .error-summary {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
            background-color: white;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>

    <h2>User Registration & Data Management</h2>
    
    <!-- Area to display validation errors -->
    <div id="errorSummary" class="error-summary"></div>

    <form id="userForm" novalidate>
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number (10 digits)</label>
            <input type="text" id="phone" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" class="validate-empty" rows="4"></textarea>
        </div>

        <button type="button" id="commitBtn">Commit</button>
        <button type="button" id="viewBtn">View Entries</button>
    </form>

    <!-- Target container where the dynamic table will be rendered -->
    <div id="tableContainer"></div>

    <!-- Link to external JavaScript file -->
    <script src="app.js"></script>
</body>
</html>

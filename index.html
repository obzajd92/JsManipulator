<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Application - Dracula Theme</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>User Registration (Dracula UI)</h2>
    
    <div id="errorSummary" class="error-summary"></div>

    <form id="userForm" novalidate>
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number (10 digits)</label>
            <input type="text" id="phone" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" class="validate-empty" rows="4"></textarea>
        </div>

        <div class="btn-group">
            <button type="button" id="commitBtn">Commit</button>
            <button type="button" id="viewBtn" onclick="window.location.href='entries.html'">View Entries</button>
            <button type="button" id="downloadBtn">Download JSON</button>
            <button type="button" id="clearBtn">Clear Data</button>
        </div>
    </form>

    <script src="app.js"></script>
</body>
</html>

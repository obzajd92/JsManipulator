<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Application - Dracula Theme DOM Manipulation</title>
    <!-- Link to the separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>User Registration & Data Management (Dracula UI)</h2>
    
    <!-- Error summary anchor block -->
    <div id="errorSummary" class="error-summary"></div>

    <form id="userForm" novalidate>
        <!-- Keep track of currently edited index row state -->
        <input type="hidden" id="editIndex" value="-1">

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="phone">Phone Number (10 digits)</label>
            <input type="text" id="phone" class="validate-empty">
        </div>

        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" class="validate-empty" rows="4"></textarea>
        </div>

        <div class="btn-group">
            <button type="button" id="commitBtn">Commit</button>
            <button type="button" id="viewBtn">View Entries</button>
            <button type="button" id="downloadBtn">Download JSON</button>
            <button type="button" id="clearBtn">Clear Data</button>
        </div>
    </form>

    <!-- Target container where the dynamic table will be rendered -->
    <div id="tableContainer"></div>

    <!-- Link to the external JavaScript file -->
    <script src="app.js"></script>
</body>
</html>
